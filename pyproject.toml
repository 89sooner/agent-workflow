[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-workflow"
version = "0.3.0"
description = "Local task state, verification and bounded Codex/Claude workflows"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-workflow = "agent_workflow.cli:main"

[tool.setuptools.packages.find]
include = ["agent_workflow*"]

[tool.setuptools.package-data]
agent_workflow = ["static/*", "*.mjs"]
