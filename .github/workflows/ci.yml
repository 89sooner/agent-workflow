name: Workflow verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controller:
    name: Controller / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test state, evidence, recovery, releases, and HTTP APIs
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: Verify installed package includes the observatory
        run: |
          python -m pip install . --no-deps
          cd "$RUNNER_TEMP"
          python -c "from importlib.resources import files; root = files('agent_workflow'); assert all(root.joinpath('static', name).is_file() for name in ('mission.html', 'mission.js', 'mission.css', 'mission-icon.svg', 'MISSION_LICENSES.txt'))"

  browser:
    name: Browser / actual local workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the production React bundle
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test:mission
          npm run check:mission
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/workflow-browser" --no-audit --no-fund playwright@1.51.1
          "$RUNNER_TEMP/workflow-browser/node_modules/.bin/playwright" install --with-deps chromium
          if [ -z "$(fc-list :lang=ko -f '%{family}')" ]; then
            timeout 180 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 install --yes --no-install-recommends fonts-nanum
          fi
          test -n "$(fc-list :lang=ko -f '%{family}')"
      - name: React management, observatory and controller-backed browser acceptance
        env:
          WORKFLOW_PLAYWRIGHT_PATH: ${{ runner.temp }}/workflow-browser/node_modules/playwright
          WORKFLOW_SCREENSHOT_DIR: ${{ runner.temp }}/workflow-screenshots
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python tests/ui_integration.py
          node tests/workers_browser.mjs
          node tests/instanced_workers_browser.mjs
          python tests/mission_integration.py
          python tests/opencode_integration.py
          python tests/onboarding_integration.py
          python tests/native_integration.py
          WORKFLOW_NATIVE_SCENARIO=tests/bookmarks_scenarios.mjs python tests/native_integration.py
          node tests/plugins.mjs
          node tests/plugins_v2.mjs
          python scripts/package-plugins.py
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatory-browser-evidence
          path: ${{ runner.temp }}/workflow-screenshots
          if-no-files-found: ignore
